name: Client CI

on:
  push:
    branches:
      - development
      - main
    paths:
      - "mobile/**"
      - "web/**"
      - ".github/workflows/client-ci.yml"

  pull_request:
    branches:
      - development
      - main
    paths:
      - "mobile/**"
      - "web/**"
      - ".github/workflows/client-ci.yml"

jobs:
  client:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - mobile
          - web

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            mobile/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        if: matrix.app == 'web'
        run: pnpm build
