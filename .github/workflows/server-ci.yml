name: Server CI

on:
  push:
    branches: ["development", "main"]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

  pull_request:
    branches: ["development", "main"]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies
        run: pnpm install

      - name: Server linting
        run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies
        run: pnpm install

      - name: Server typecheck
        run: pnpm run check-types

